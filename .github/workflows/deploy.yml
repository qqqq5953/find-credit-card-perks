name: 部署並通知持卡人

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate-cards

      - name: 部署到 Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            d1 migrations apply perks-db --remote
            deploy

      - name: 比對卡片資料變動
        id: diff
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          npm run --silent diff-cards -- --base ${{ github.event.before }} > changes.json
          cat changes.json
          echo "count=$(node -p 'require("./changes.json").changes.length')" >> "$GITHUB_OUTPUT"

      - name: 推播給持卡人
        if: steps.diff.outputs.count && steps.diff.outputs.count != '0'
        run: |
          curl -fsS -X POST "${{ vars.WORKER_URL }}/internal/notify" \
            -H "Authorization: Bearer ${{ secrets.NOTIFY_SECRET }}" \
            -H "Content-Type: application/json" \
            --data @changes.json
