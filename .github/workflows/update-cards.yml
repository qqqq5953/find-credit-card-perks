name: 偵測權益變動

on:
  schedule:
    - cron: "17 1 * * *" # 每天台灣時間 09:17
  workflow_dispatch:
    inputs:
      only:
        description: "只檢查這些卡片（逗號分隔的卡片 ID，留空代表全部）"
        required: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  detect:
    # 設定完成前先停用：到 repo 的 Settings → Secrets and variables → Actions → Variables
    # 新增 ENABLE_AUTOMATION = true 才會執行（見 SETUP.md）。停用時會顯示為 skipped，不會寄失敗通知
    if: vars.ENABLE_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      ADMIN_LINE_USER_ID: ${{ secrets.ADMIN_LINE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: 檢查是否有卡片需要設定抓取方式
        id: sources
        run: |
          echo "# 信用卡權益資料更新" > .update-summary.md
          # 缺少網址，或還沒確認是否要點進子頁面（沒有 follow_links 欄位）
          echo "missing=$(node -p 'require("./data/sources.json").sources.filter(s => !s.url || !("follow_links" in s)).length')" >> "$GITHUB_OUTPUT"

      - name: 用 Claude Code 設定官方網址與子頁面
        if: steps.sources.outputs.missing != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "請依照 prompts/find-sources.md 的指示處理。"
          claude_args: >-
            --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch"

      - name: 抓取權益頁面並比對
        id: fetch
        run: npm run fetch-sources -- ${{ inputs.only && format('--only {0}', inputs.only) || '' }}

      - name: 整理抓取結果
        run: |
          node -e '
            const r = require("./fetch-result.json");
            const label = { baseline: "🆕 第一次抓到", changed: "🔄 有變動", unchanged: "✅ 沒變動", error: "❌ 失敗", no_url: "⏭️ 沒有網址" };
            const rows = r.results.map(x => `| ${x.card_id} | ${label[x.status]} | ${x.error ?? ""} |`);
            console.log(["", "## 抓取結果", "", "| 卡片 | 狀態 | 說明 |", "|---|---|---|", ...rows].join("\n"));
          ' >> .update-summary.md

      - name: 抓取失敗時通知管理者
        if: steps.fetch.outputs.error_count != '0'
        run: |
          msg=$(node -e 'const r=require("./fetch-result.json");console.log("⚠️ 權益頁面抓取失敗，請確認網址：\n"+r.errors.map(e=>`・${e.card_id}：${e.error}`).join("\n"))')
          npx tsx scripts/notify-admin.ts "$msg"

      - name: 準備 Claude 的指示
        id: prompt
        if: steps.fetch.outputs.targets != ''
        run: |
          {
            echo "text<<PROMPT_EOF"
            sed -e "s/{{CHANGED}}/${{ steps.fetch.outputs.changed || '（無）' }}/" \
                -e "s/{{NEW_CARDS}}/${{ steps.fetch.outputs.new_cards || '（無）' }}/" prompts/update-card.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 用 Claude Code 建立或更新卡片資料
        if: steps.fetch.outputs.targets != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git diff:*),Bash(npm run validate-cards)"

      - name: 驗證更新後的資料
        run: |
          if npm test && npm run validate-cards; then
            printf '\n---\n✅ 測試與資料驗證通過\n' >> .update-summary.md
          else
            printf '\n---\n❌ 測試或資料驗證失敗，請查看 Actions 紀錄後修正再 merge\n' >> .update-summary.md
          fi

      - name: 建立 PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/update-cards
          add-paths: |
            data/**
            snapshots/**
          commit-message: "更新信用卡權益資料${{ steps.fetch.outputs.targets && format('：{0}', steps.fetch.outputs.targets) || '' }}"
          title: "更新信用卡權益資料${{ steps.fetch.outputs.targets && format('：{0}', steps.fetch.outputs.targets) || '' }}"
          body-path: .update-summary.md
          delete-branch: true

      - name: 通知管理者有 PR 待確認
        if: steps.pr.outputs.pull-request-url
        run: |
          npx tsx scripts/notify-admin.ts "🔄 信用卡權益資料有更新，請確認後 merge：
          ${{ steps.pr.outputs.pull-request-url }}"
